name: AirPad

options:
  bundleIdPrefix: com.doctorpresident
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

schemes:
  AirPad:
    build:
      targets:
        AirPad: all
    run:
      config: Release
      debugEnabled: false
    test:
      config: Debug
      targets:
        - AirPadUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: 8XM4B5F42Y
    # Pin automatic signing with the CURRENT identity. Without this, xcodegen
    # defaults CODE_SIGN_IDENTITY to the deprecated "iPhone Developer", which the
    # CoreDevice installer rejects on device with "The executable is not
    # codesigned" (LaunchExecutableValidationErrorDomain). "Apple Development" +
    # Automatic is what Xcode expects; archive/Distribution is picked automatically.
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    # Default build-number "floor" for CFBundleVersion. Both Info.plists set
    # CFBundleVersion to $(CURRENT_PROJECT_VERSION); this is the ONLY place that
    # gives the variable a value for builds that don't pass it on the command
    # line — i.e. every Xcode GUI Build & Run. Without it the variable expands to
    # EMPTY, and an empty CFBundleVersion is TOLERATED on the host app but FATAL
    # on the app extension: -[MIAppExtensionBundle validateBundleMetadataWithError:]
    # rejects the local install with MIInstallerErrorDomain 33 /
    # MissingBundleVersion (appexes are validated more strictly than the host,
    # which is why only AirPadShare.appex tripped). That was the 429c54d
    # regression — it pinned CFBundleVersion but never gave the variable a floor.
    # DO NOT DELETE as redundant.
    # testflight_upload.sh passes CURRENT_PROJECT_VERSION=<build> on the xcodebuild
    # command line; command-line build settings override this default, so
    # TestFlight uploads still get their unique number and this "1" is used only
    # by local GUI/dev builds (which never upload).
    CURRENT_PROJECT_VERSION: "1"

packages:
  FloatingPanel:
    url: https://github.com/scenee/FloatingPanel
    exactVersion: 3.2.2
  # ── Local on-device model (ws-local-model Stage 1, 2026-08-13) ──
  # MLX runtime for the optional downloadable Qwen3-1.7B-4bit model (spike device-verified,
  # Ops/briefs/device-local-model.md). Pinned to the spike's exact versions. mlx-swift 0.29.1
  # is pulled TRANSITIVELY by mlx-swift-examples 2.29.1 (same resolution the spike proved).
  # ★ main gutted the MLXLLM/MLXLMCommon libraries — a release tag still vends them.
  MLXSwiftExamples:
    url: https://github.com/ml-explore/mlx-swift-examples
    exactVersion: 2.29.1
  # swift-transformers is already transitive (mlx-swift-examples → .upToNextMinor 1.0.0); declared
  # DIRECTLY only so LocalModelService can `import Hub` for HubApi(downloadBase:) — the model must
  # download to Application Support, NOT the mlx default (Caches, evictable) or Documents (iCloud).
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    exactVersion: 1.0.0
  # ── Synthesized-voice (Kokoro MLX/ANE + ORT) SPM packages REMOVED 2026-08-02 ──
  # The whole shelved TTS runtime was removed from the build — AVSpeechSynthesizer is
  # the sole read-aloud engine. Removed here: KokoroSwift, mlx-swift (0.29.1),
  # MLXUtilsLibrary (0.0.6), FluidAudio (0.15.5) — plus onnxruntime (ORT) removed
  # earlier 2026-07-31. FULL RESTORE STEPS (packages + exact versions/revisions, the
  # deleted source files, the int8 weight, and the SpeechSynthesisService/ChatTranscript
  # /SettingsView branches) live in Ops/workstreams/ws-synthesized-voice.md → sections
  # "WHOLE KOKORO STACK REMOVED" (MLX/ANE, commit-preserved at 45ab69f) + "ORT REMOVED"
  # (ORT engine at commit c1ddf9e). ★ On ORT restore pin the CPU EP — NEVER CoreML (BNNS crash).

targets:
  AirPad:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: AirPad
        excludes:
          - "Info.plist"
          - "*.entitlements"
          # Resources/Kokoro holds the SHELVED TTS weights (gitignored, T drops
          # them in). UN-BUNDLED 2026-07-29: the folder-reference resource entry
          # that used to ship this directory was removed, so ~724 MB of
          # shelved-feature model no longer bundles (835 MB → ~110 MB .app). The
          # files stay ON DISK (un-bundling, not deleting). Still excluded from
          # the code group so the .onnx/.safetensors are neither compiled NOR
          # bundled. The engines locate weights via `Bundle.main.url(...)` →
          # nil → `throw .modelNotInstalled` → AVSpeech, so a missing model
          # fails gracefully. RESUMING the arc = re-add a folder reference here
          # + re-drop weights (int8 ONLY — see ws-synthesized-voice.md).
          - "Resources/Kokoro"
          - "Resources/Kokoro/**"
    dependencies:
      - target: AirPadShare
        embed: true
      - package: FloatingPanel
      # Local on-device model (ws-local-model Stage 1). MLXLLM/MLXLMCommon from
      # mlx-swift-examples 2.29.1 (mlx-swift 0.29.1 transitive). Plumbing only this
      # stage — no generation path uses it yet (LocalModelService + Settings surface).
      - package: MLXSwiftExamples
        product: MLXLLM
      - package: MLXSwiftExamples
        product: MLXLMCommon
      - package: SwiftTransformers
        product: Hub
      # Synthesized-voice deps (KokoroSwift / mlx-swift / MLXUtilsLibrary / FluidAudio,
      # + ORT earlier) REMOVED 2026-08-02 — AVSpeech is the sole read-aloud engine.
      # Restore steps in Ops/workstreams/ws-synthesized-voice.md.
      - sdk: SpriteKit.framework
      - sdk: AVFoundation.framework
      - sdk: Speech.framework
      - sdk: FoundationModels.framework
      - sdk: PhotosUI.framework
      - sdk: AVKit.framework
      - sdk: Security.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doctorpresident.airpad
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: AirPad/AirPad.entitlements
        DEVELOPMENT_TEAM: 8XM4B5F42Y
        # Re-pin signing at the TARGET level too. The project-level pin (see
        # settings.base up top) is OUTRANKED by xcodegen's per-target auto-default
        # of CODE_SIGN_IDENTITY="iPhone Developer", which the CoreDevice installer
        # rejects on device ("executable is not codesigned"). A target-level pin
        # wins. A package-set change once surfaced this — the app target's
        # Debug+Release flipped to "iPhone Developer". Re-verify a DEVICE install
        # after any `xcodegen generate`.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        # App icon = the Icon Composer bundle AirPad/AirPad.icon (a standalone
        # `wrapper.icon` resource — NOT inside Assets.xcassets; actool rejects a
        # nested .icon in a catalog). The legacy AppIcon.appiconset stays as an
        # unused fallback. Validated: actool compiles AirPad.icon and emits
        # CFBundleIconName=AirPad.
        ASSETCATALOG_COMPILER_APPICON_NAME: AirPad
      configs:
        # T's device-checkpoint entitlement (2026-08-13), moved OUT of the Xcode pbxproj edit into
        # project.yml so it survives every `xcodegen generate`. Release signs with
        # AirPadRelease.entitlements (increased-memory-limit + extended-virtual-addressing for the
        # local MLX model). Debug uses settings.base's AirPad.entitlements — which ALSO carries the
        # two memory keys now (T: "Debug too"), so Xcode Run dev builds get the headroom on device.
        Release:
          CODE_SIGN_ENTITLEMENTS: AirPad/AirPadRelease.entitlements
    info:
      path: AirPad/Info.plist
      properties:
        CFBundleDisplayName: AirPad
        # Build number MUST come from CURRENT_PROJECT_VERSION, not xcodegen's
        # default of "1". Without this, every `xcodegen generate` rewrites
        # Info.plist with CFBundleVersion=1, and the testflight script's
        # `-CURRENT_PROJECT_VERSION <n>` can't override a literal → uploads
        # ship build "1" and App Store Connect silently rejects them as
        # duplicates (they "never land"). $(CURRENT_PROJECT_VERSION) makes the
        # script's number (AIRPAD_BUILD_NUMBER or the timestamp default) win.
        # The variable's default "floor" lives in the project-level settings.base
        # (see the note there) — keep this a variable, never a literal.
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIAppFonts:
          - Lato-Regular.ttf
          - Lato-Bold.ttf
          - Fraunces_72pt-Regular.ttf
          - Fraunces_72pt-Bold.ttf
          - Lora-Regular.ttf
          - Lora-Bold.ttf
          # Note editor serif typography (SB121) — Source Serif 4 (default) +
          # Lora italic (bundled for the forthcoming user-selectable font picker).
          - Lora-Italic.ttf
          # Full core family (OFL) — Regular/Semibold/Bold × upright+italic — so the
          # weight-aware serif re-facing (NoteFontChoice.faceName) can honour a run's
          # numeric weight AND italic. The note BODY renders at Semibold (headings Bold),
          # so -Semibold/-SemiboldItalic carry the body; Bold carries emphasis + Title.
          # PS names: -Regular/-It/-Semibold/-SemiboldIt/-Bold/-BoldIt.
          - SourceSerif4-Regular.ttf
          - SourceSerif4-Italic.ttf
          - SourceSerif4-Semibold.ttf
          - SourceSerif4-SemiboldItalic.ttf
          - SourceSerif4-Bold.ttf
          - SourceSerif4-BoldItalic.ttf
        UILaunchScreen: {}
        # Portrait-only, full screen. App has no rotation handling and opts out
        # of iPad multitasking; also required by App Store validation (90474)
        # since the target is Universal (iPhone+iPad).
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        # Export compliance: the app uses only exempt encryption (standard
        # HTTPS/system crypto). Declaring this suppresses the export-compliance
        # prompt on every TestFlight upload — App Store Connect reads it here.
        ITSAppUsesNonExemptEncryption: false
        # `audio` is required for `AVPlayerViewController` to surface its
        # Picture-in-Picture button. `allowsPictureInPicturePlayback = true`
        # on the controller is necessary but not sufficient — the PiP
        # affordance is gated on this background-mode declaration even when
        # the app never actually plays in the background. Used by the
        # gallery video viewer (`GalleryFullscreenViewer` →
        # `FullscreenVideoPlayer`).
        UIBackgroundModes:
          - audio
        CFBundleURLTypes:
          - CFBundleURLName: com.doctorpresident.airpad
            CFBundleURLSchemes:
              - airpad
        NSUbiquitousContainers:
          iCloud.com.doctorpresident.airpad:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: AirPad
            NSUbiquitousContainerSupportedFolderLevels: Any
        NSMicrophoneUsageDescription: "AirPad needs microphone access to record voice notes."
        NSSpeechRecognitionUsageDescription: "AirPad uses speech recognition to transcribe your voice notes."
        NSCameraUsageDescription: "AirPad uses the camera to capture photos and videos as ideas."
        NSPhotoLibraryUsageDescription: "AirPad can add photos from your library to an idea."
        NSLocalNetworkUsageDescription: "AirPad needs local network access to reach the Ollama or LM Studio endpoint you configured in Settings. Only used for queries you initiate."
        # ATS exception for user-configured local-AI endpoints. NSAllowsLocalNetworking
        # is too narrow — it only covers .local / link-local / unqualified hostnames,
        # not RFC 1918 ranges (10.x, 192.168.x, 172.16-31.x) and not Tailscale CGNAT
        # (100.64.0.0/10). Since the endpoint is user-supplied at runtime, no static
        # flag is more narrow than this. Privacy oath remains enforced in code:
        # ModelRouter only routes to Ollama when the user has explicitly entered an
        # endpoint in Settings — ATS is not the privacy gate, the empty-endpoint
        # check is. No other URLSession HTTP paths exist in the app today.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true

  AirPadShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: AirPadShare
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: AirPad/Models
        excludes:
          - "EntryMigration.swift"
          - "EntryMigrationSelfTest.swift"
          - "EntryDeletionDiagnostic.swift"
          - "ClipboardContentRouterDiagnostic.swift"
          # References CorpusStore (app-target only) for the normalize-invariant
          # assertion — same reason the other self-tests are excluded here.
          - "FieldValueSelfTest.swift"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doctorpresident.airpad.share
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: 8XM4B5F42Y
        CODE_SIGN_ENTITLEMENTS: AirPadShare/AirPadShare.entitlements
    info:
      path: AirPadShare/Info.plist
      properties:
        CFBundleDisplayName: AirPad Share
        # Must match the host app's version (App Store validation). Same fix as
        # the app target — pin to CURRENT_PROJECT_VERSION, not xcodegen's "1".
        # CRITICAL: this appex is validated MORE STRICTLY than the host app — an
        # empty CFBundleVersion is tolerated on the app but FATAL here
        # (MIInstallerErrorDomain 33 / MissingBundleVersion at install time). The
        # variable therefore MUST keep a default floor in the project-level
        # settings.base; without it, Xcode GUI Build & Run can't install.
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Export compliance — mirror the main app; only exempt encryption.
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # App Store validation (90362) rejects the TRUEPREDICATE string.
            # Declare the content types ShareViewController actually handles:
            # web URLs, text, images, and generic files/data.
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsFileWithMaxCount: 10

  # MD14 measurement-only UI test target (drives a real synthesized tap into the
  # note editor in the Simulator; the app traces the caret event sequence to a
  # file CC reads back). Only in the `test` action — normal builds/TestFlight
  # never build it.
  AirPadUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: AirPadUITests
    dependencies:
      - target: AirPad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doctorpresident.airpad.uitests
        DEVELOPMENT_TEAM: 8XM4B5F42Y
        TEST_TARGET_NAME: AirPad
        GENERATE_INFOPLIST_FILE: YES
